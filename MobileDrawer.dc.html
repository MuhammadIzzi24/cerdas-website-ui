<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:390px;max-width:100vw;z-index:90;background:#FFFFFF;border-left:1px solid #E8ECF1;border-right:1px solid #E8ECF1;display:flex;flex-direction:column">

<div style="flex:none;height:56px;background:#FFFFFF;border-bottom:1px solid #D8DEE5;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 16px">
<img src="assets/cerdas-logo.png" alt="CERDAS" style="height:24px;width:auto;display:block">
<button type="button" onClick="{{ onClose }}" aria-label="Close menu" style="width:46px;height:46px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;padding:0;cursor:pointer">
<svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M3.5 3.5 L14.5 14.5 M14.5 3.5 L3.5 14.5" stroke="#14181D" stroke-width="1.9"></path></svg>
</button>
</div>

<div style="flex:none;padding:14px 16px 12px;border-bottom:1px solid #E8ECF1">
<div style="position:relative;display:flex;align-items:center">
<svg width="17" height="17" viewBox="0 0 18 18" fill="none" style="position:absolute;left:14px;pointer-events:none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="#5A6472" stroke-width="1.6"></circle><path d="M12.4 12.4 L16 16" stroke="#5A6472" stroke-width="1.6"></path></svg>
<input type="text" placeholder="Search people, publications, projects" style="width:100%;box-sizing:border-box;height:48px;font:400 15px Inter,sans-serif;color:#14181D;background:#FAFAF8;border:1px solid #D8DEE5;border-radius:6px;padding:0 14px 0 40px;outline:none">
</div>
<div data-hscroll="1" style="display:flex;gap:6px;margin-top:10px;overflow-x:auto;-webkit-overflow-scrolling:touch">
<span style="flex:none;font:600 10.5px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#FFFFFF;background:#004B8C;padding:6px 11px;border-radius:4px">ALL</span>
<span style="flex:none;font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5A6472;background:#FFFFFF;border:1px solid #D8DEE5;padding:5px 11px;border-radius:4px">PEOPLE</span>
<span style="flex:none;font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5A6472;background:#FFFFFF;border:1px solid #D8DEE5;padding:5px 11px;border-radius:4px">PUBLICATIONS</span>
<span style="flex:none;font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5A6472;background:#FFFFFF;border:1px solid #D8DEE5;padding:5px 11px;border-radius:4px">NEWS</span>
</div>
</div>

<div data-scroll="1" style="flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch">
<sc-for list="{{ items }}" as="it" hint-placeholder-count="6">

<sc-if value="{{ it.flat }}" hint-placeholder-val="{{ false }}">
<a href="{{ it.href }}" style="position:relative;display:flex;align-items:center;min-height:58px;padding:0 16px;border-bottom:1px solid #E8ECF1;font:600 16px Inter,sans-serif;color:#14181D">
<sc-if value="{{ it.active }}" hint-placeholder-val="{{ true }}"><span style="position:absolute;left:0;top:0;bottom:0;width:3px;background:#E38C07"></span></sc-if>
{{ it.label }}
</a>
</sc-if>

<sc-if value="{{ it.group }}" hint-placeholder-val="{{ true }}">
<div style="border-bottom:1px solid #E8ECF1">
<button type="button" onClick="{{ it.toggle }}" style="position:relative;width:100%;box-sizing:border-box;min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px 0 16px;background:transparent;border:0;cursor:pointer;text-align:left">
<sc-if value="{{ it.active }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;top:0;bottom:0;width:3px;background:#E38C07"></span></sc-if>
<span style="font:600 16px/1.3 Inter,sans-serif;color:#14181D">{{ it.label }}</span>
<span style="flex:none;display:flex;align-items:center;gap:9px">
<span style="font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:#8A94A2">{{ it.count }}</span>
<span style="width:28px;height:28px;border-radius:6px;background:{{ it.chevBg }};display:flex;align-items:center;justify-content:center;font:400 10px Inter,sans-serif;color:{{ it.chevFg }}">{{ it.chev }}</span>
</span>
</button>
<sc-if value="{{ it.expanded }}" hint-placeholder-val="{{ false }}">
<div style="background:#FAFAF8;border-top:1px solid #E8ECF1;padding:4px 0 8px">
<sc-for list="{{ it.children }}" as="c" hint-placeholder-count="4">
<a href="{{ c.href }}" style="display:flex;align-items:center;min-height:48px;padding:0 16px 0 30px;font:400 15px Inter,sans-serif;color:#004B8C;border-bottom:1px solid #EFF2F5">{{ c.label }}</a>
</sc-for>
<a href="{{ it.href }}" style="display:flex;align-items:center;min-height:46px;padding:0 16px 0 30px;font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:#5A6472">{{ it.allLabel }}</a>
</div>
</sc-if>
</div>
</sc-if>

</sc-for>

<div style="padding:24px 16px 30px;background:#FAFAF8;border-top:1px solid #E8ECF1">
<div style="width:34px;height:3px;background:#E38C07;margin-bottom:16px"></div>
<div style="font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#5A6472;margin-bottom:12px">CONTACT</div>
<div style="font:500 14px/1.8 'IBM Plex Mono',monospace;color:#14181D">cerdas@utp.edu.my<br>+605 368 8000</div>
<div style="margin-top:14px;font:400 13.5px/1.65 Inter,sans-serif;color:#5A6472">Universiti Teknologi PETRONAS<br>32610 Seri Iskandar, Perak, Malaysia</div>
</div>
</div>

<div style="flex:none;border-top:1px solid #D8DEE5;background:#FFFFFF;padding:12px 16px 18px">
<a href="CERDAS Join.dc.html" style="display:flex;align-items:center;justify-content:center;height:52px;font:600 15.5px Inter,sans-serif;color:#FFFFFF;background:#004B8C;border-radius:6px">Join CERDAS</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Home&quot;,&quot;About&quot;,&quot;Research&quot;,&quot;People&quot;,&quot;Publications &amp; Innovation&quot;,&quot;Impact&quot;],&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}">
const NAV = [
  { label: 'Home', href: 'CERDAS Home.dc.html', children: [] },
  { label: 'About', href: 'CERDAS Our Vision.dc.html', children: [
    ['Our vision', 'CERDAS Our Vision.dc.html'],
    ['Organisation chart', 'CERDAS Organisation Chart.dc.html'],
    ['Researcher framework', 'CERDAS Fellowship Framework.dc.html'],
    ['Facilities', 'CERDAS Facilities.dc.html'],
    ['Collaborate with us', 'CERDAS Join.dc.html#collaborate']
  ] },
  { label: 'Research', href: 'CERDAS Research.dc.html', children: [
    ['Four research groups', 'CERDAS Research.dc.html'],
    ['Projects', 'CERDAS Projects.dc.html'],
    ['Datasets', 'CERDAS Datasets.dc.html'],
    ['Research software', 'CERDAS Software.dc.html']
  ] },
  { label: 'People', href: 'CERDAS Mobile People.dc.html', children: [
    ['All researchers', 'CERDAS Mobile People.dc.html'],
    ['Leadership', 'CERDAS Organisation Chart.dc.html'],
    ['Researcher tiers', 'CERDAS Fellowship Framework.dc.html'],
    ['Postgraduate places', 'CERDAS Join.dc.html']
  ] },
  { label: 'Publications & Innovation', href: 'CERDAS Publications.dc.html', children: [
    ['Publications register', 'CERDAS Publications.dc.html'],
    ['Inventions & Products', 'CERDAS Inventions and Products.dc.html'],
    ['Software and datasets', 'CERDAS Software.dc.html'],
    ['Technology transfer', 'CERDAS Technology Transfer.dc.html']
  ] },
  { label: 'Impact', href: 'CERDAS Industry.dc.html', children: [
    ['Industry collaboration', 'CERDAS Industry.dc.html'],
    ['Partnerships', 'CERDAS Partnerships.dc.html'],
    ['Consultancy and training', 'CERDAS Consultancy.dc.html'],
    ['Research dashboard', 'CERDAS Mobile Dashboard.dc.html'],
    ['News and events', 'CERDAS News and Events.dc.html']
  ] }
];

class Component extends DCLogic {
  state = { exp: null };

  renderVals() {
    const active = this.props.active ?? 'Home';
    const exp = this.state.exp === null ? active : this.state.exp;
    return {
      onClose: this.props.onClose,
      items: NAV.map(n => {
        const expanded = n.children.length > 0 && exp === n.label;
        return {
          label: n.label, href: n.href, active: n.label === active,
          flat: n.children.length === 0, group: n.children.length > 0,
          expanded,
          chev: expanded ? '▲' : '▼',
          chevBg: expanded ? '#004B8C' : '#F1F3F5',
          chevFg: expanded ? '#FFFFFF' : '#004B8C',
          count: n.children.length ? String(n.children.length) : '',
          allLabel: 'ALL OF ' + n.label.toUpperCase() + ' →',
          children: n.children.map(([label, href]) => ({ label, href })),
          toggle: () => this.setState({ exp: expanded ? '' : n.label })
        };
      })
    };
  }
}

</script>
</body>
</html>
