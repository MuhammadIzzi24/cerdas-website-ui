<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:#FFFFFF;border:1px solid #D8DEE5;border-radius:8px;padding:26px 24px">
<div style="width:34px;height:3px;background:#E38C07;margin-bottom:18px"></div>
<h3 style="margin:0 0 8px;font:700 19px/1.25 'Inter Tight',sans-serif;letter-spacing:-.01em;color:#14181D">{{ title }}</h3>
<div style="display:flex;flex-direction:column">
<sc-for list="{{ items }}" as="item" hint-placeholder-count="4">
<a href="{{ href }}" style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid #E6EEF5;font:500 14px Inter,sans-serif;color:#14181D" style-hover="color:#004B8C"><span>{{ item }}</span><span style="font:600 14px Inter,sans-serif;color:#004B8C">→</span></a>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:330},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Quick links&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[&quot;Full researcher directory&quot;,&quot;Visiting researchers&quot;,&quot;Research students&quot;,&quot;Collaborate with us&quot;],&quot;tsType&quot;:&quot;string[]&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
