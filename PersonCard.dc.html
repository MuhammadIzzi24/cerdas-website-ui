<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./image-slot.js"></script></helmet>
<div style="background:#FFFFFF;border:1px solid #D8DEE5;border-radius:8px;box-shadow:0 1px 3px rgba(20,24,29,.05);padding:24px;height:100%;box-sizing:border-box;display:flex;flex-direction:column">
<image-slot id="{{ slotId }}" style="width:72px;height:72px;flex:none" shape="circle" placeholder="Photo"></image-slot>
<div style="margin-top:18px;font:400 12.5px/1.35 Inter,sans-serif;color:#5A6472">{{ prefix }}</div>
<div style="margin-top:3px;font:600 17px/1.28 'Inter Tight',sans-serif;letter-spacing:-.005em;color:#14181D;text-wrap:pretty">{{ personName }}</div>
<sc-if value="{{ role }}" hint-placeholder-val="{{ true }}">
<div style="margin-top:8px;font:500 13px/1.4 Inter,sans-serif;color:#004B8C">{{ role }}</div>
</sc-if>
<div style="margin-top:18px;font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:#5A6472">RESEARCH GROUP</div>
<div style="margin-top:5px;font:400 13.5px/1.45 Inter,sans-serif;color:#14181D">{{ theme }}</div>
<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:14px">
<sc-for list="{{ chips }}" as="chip" hint-placeholder-count="2">
<dc-import name="ThemeChip" label="{{ chip }}" hint-size="110px,26px"></dc-import>
</sc-for>
</div>
<div style="margin-top:auto;padding-top:20px;display:flex;align-items:center;justify-content:space-between;gap:12px">
<div style="display:flex;gap:8px">
<a href="{{ href }}" aria-label="Email" style="width:30px;height:30px;border:1px solid #D8DEE5;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#5A6472" style-hover="border-color:#004B8C;color:#004B8C"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="1.5" stroke="currentColor" stroke-width="1.6"></rect><path d="M3.2 6.6 L12 13 L20.8 6.6" stroke="currentColor" stroke-width="1.6"></path></svg></a>
<a href="{{ href }}" aria-label="Publications" style="width:30px;height:30px;border:1px solid #D8DEE5;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#5A6472" style-hover="border-color:#004B8C;color:#004B8C"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 8.6 L12 4 L21.5 8.6 L12 13.2 Z" stroke="currentColor" stroke-width="1.6"></path><path d="M6.4 10.6 V15.6 C6.4 15.6 8.8 17.6 12 17.6 C15.2 17.6 17.6 15.6 17.6 15.6 V10.6" stroke="currentColor" stroke-width="1.6"></path></svg></a>
<a href="{{ href }}" aria-label="Profile" style="width:30px;height:30px;border:1px solid #D8DEE5;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#5A6472" style-hover="border-color:#004B8C;color:#004B8C"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8.4" r="3.7" stroke="currentColor" stroke-width="1.6"></circle><path d="M4.8 19.6 C5.6 15.9 8.5 14.2 12 14.2 C15.5 14.2 18.4 15.9 19.2 19.6" stroke="currentColor" stroke-width="1.6"></path></svg></a>
</div>
<a href="{{ href }}" aria-label="View profile" style="width:32px;height:32px;border-radius:6px;background:#E6EEF5;display:flex;align-items:center;justify-content:center;font:600 15px Inter,sans-serif;color:#004B8C" style-hover="background:#004B8C;color:#FFFFFF">→</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:420},&quot;slotId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;person-1&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;prefix&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Prof. Dr.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;personName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Aminah Zainuddin&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Data Science &amp; Analytics&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;chips&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[&quot;Machine Learning&quot;,&quot;Data Mining&quot;],&quot;tsType&quot;:&quot;string[]&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
