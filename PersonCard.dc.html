<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./image-slot.js"></script></helmet>
<div style="background:#FFFFFF;border:1px solid #D8DEE5;border-radius:8px;box-shadow:0 1px 3px rgba(20,24,29,.06);height:100%;box-sizing:border-box;padding:24px;display:flex;flex-direction:column">
<div style="width:72px;height:72px;flex:none;margin-bottom:16px"><sc-if value="{{ hasPhoto }}" hint-placeholder-val="{{ false }}"><img src="{{ photo }}" alt="{{ personName }}" style="width:72px;height:72px;border-radius:50%;object-fit:cover;object-position:center 22%;display:block;background:#E6EEF5"></sc-if><sc-if value="{{ noPhoto }}" hint-placeholder-val="{{ true }}"><image-slot id="{{ slotId }}" shape="circle" placeholder="Photo" style="width:72px;height:72px;display:block"></image-slot></sc-if></div>
<sc-if value="{{ hasHonorific }}" hint-placeholder-val="{{ true }}">
<div style="margin-bottom:4px;font:400 12.5px/1.3 Inter,sans-serif;color:#5A6472">{{ honorific }}</div>
</sc-if>
<div style="font:600 17px/1.26 'Inter Tight',sans-serif;letter-spacing:-.005em;color:#14181D;text-wrap:pretty">{{ personName }}</div>
<sc-if value="{{ hasRole }}" hint-placeholder-val="{{ true }}">
<div style="margin-top:8px;font:500 13px/1.4 Inter,sans-serif;color:#004B8C">{{ role }}</div>
</sc-if>
<sc-if value="{{ hasGroup }}" hint-placeholder-val="{{ true }}">
<div style="margin-top:18px;font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:#5A6472">RESEARCH GROUP</div>
<div style="margin-top:6px;font:400 13.5px/1.48 Inter,sans-serif;color:#14181D;text-wrap:pretty">{{ group }}</div>
</sc-if>
<sc-if value="{{ hasChips }}" hint-placeholder-val="{{ true }}">
<div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:6px">
<sc-for list="{{ chips }}" as="c" hint-placeholder-count="2">
<span style="font:500 11.5px/24px 'IBM Plex Mono',monospace;color:#00335F;background:#E6EEF5;border-radius:4px;padding:0 8px;white-space:nowrap">{{ c }}</span>
</sc-for>
</div>
</sc-if>
<div style="margin-top:auto;padding-top:20px;display:flex;align-items:center;justify-content:space-between;gap:12px">
<div style="display:flex;gap:8px">
<a href="{{ mailto }}" aria-label="Email" title="{{ email }}" style="width:32px;height:32px;box-sizing:border-box;border:1px solid #D8DEE5;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#5A6472" style-hover="border-color:#004B8C;color:#004B8C"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg></a>
<a href="#" aria-label="Google Scholar" style="width:32px;height:32px;box-sizing:border-box;border:1px solid #D8DEE5;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#5A6472" style-hover="border-color:#004B8C;color:#004B8C"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"></path><path d="M6 11v5c3 2 9 2 12 0v-5"></path></svg></a>
<a href="{{ profileHref }}" aria-label="Profile" style="width:32px;height:32px;box-sizing:border-box;border:1px solid #D8DEE5;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#5A6472" style-hover="border-color:#004B8C;color:#004B8C"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></a>
</div>
<a href="{{ profileHref }}" aria-label="View profile" style="width:32px;height:32px;border-radius:6px;background:#E6EEF5;display:flex;align-items:center;justify-content:center;font:600 15px Inter,sans-serif;color:#004B8C" style-hover="background:#004B8C;color:#FFFFFF">→</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:420},&quot;honorific&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Assoc. Prof. Ts. Dr.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;personName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Hitham Seddig Alhassan Alhussian&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Group Head&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;department&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;group&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Data Science &amp; Analytics&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;chips&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Data Science|Analytics&quot;,&quot;tsType&quot;:&quot;string[] | string&quot;},&quot;email&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;seddig.alhussian@utp.edu.my&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;slotId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const PHOTOS = {
  'hamzah-sakidin': 'assets/people/hamzah-sakidin.png',
  'izzatdin-abdul-aziz': 'assets/people/izzatdin-abdul-aziz.png',
  'jafreezal-jaafar': 'assets/people/jafreezal-jaafar.jpg',
  'maged-mohamed-saeed-nasser': 'assets/people/maged-saeed-nasser.jpg',
  'maged-mohammed-saeed-nasser': 'assets/people/maged-saeed-nasser.jpg',
  'nazleeni-samiha-haron-baharon': 'assets/people/nazleeni-samiha-haron.png',
  'noureen-talpur': 'assets/people/noureen-talpur.jpeg',
  'nur-syadhila-che-lah': 'assets/people/nur-syadhila-che-lah.jpg',
  'said-jadid-abdulkadir': 'assets/people/said-jadid-abdulkadir.png',
  'shuhaida-mohamed-shuhidan': 'assets/people/shuhaida-mohamed-shuhidan.jpg',
  'syahirah-bt-suboh': 'assets/people/syahirah-suboh.jpg',
  'yaman-hamed': 'assets/people/yaman-hamed.jpg',
  'ibrahim-venkat-krishnamurthy': 'assets/people/ibrahim-venkat-krishnamurthy.png'
};
class Component extends DCLogic {
  renderVals() {
    const v = k => this.props[k] ?? '';
    const name = v('personName'), email = v('email'), href = v('href');
    const role = v('role') || v('department');
    const chips = Array.isArray(this.props.chips) ? this.props.chips : (v('chips') ? String(v('chips')).split('|') : []);
    const nameKey = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const photo = this.props.photo || PHOTOS[nameKey] || '';
    return {
      photo, hasPhoto: !!photo, noPhoto: !photo,
      slotId: v('slotId') || 'person-' + name.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
      honorific: v('honorific'), hasHonorific: !!v('honorific'),
      personName: name,
      role, hasRole: !!role,
      group: v('group'), hasGroup: !!v('group'),
      chips, hasChips: chips.length > 0,
      email, mailto: email ? 'mailto:' + email : '#',
      profileHref: href || '#'
    };
  }
}
</script>
</body>
</html>
