<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:grid;grid-template-columns:84px 1fr 168px;gap:26px;padding:26px 0;border-bottom:1px solid #E8ECF1;align-items:start">
<div>
<div style="font:600 21px/1 'IBM Plex Mono',monospace;color:#004B8C;letter-spacing:-.02em">{{ year }}</div>
<div style="margin-top:10px;font:500 9.5px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#5A6472">{{ typeLabel }}</div>
<sc-if value="{{ hasQuartile }}" hint-placeholder-val="{{ true }}">
<div style="margin-top:10px;display:inline-block;background:rgba(0,75,140,.08);color:#004B8C;font:600 10.5px 'IBM Plex Mono',monospace;letter-spacing:.06em;padding:4px 8px;border-radius:4px">{{ quartile }}</div>
</sc-if>
</div>
<div>
<a href="{{ href }}" style="display:block;font:600 17.5px/1.34 'Inter Tight',sans-serif;letter-spacing:-.008em;color:#14181D;text-wrap:pretty" style-hover="color:#004B8C">{{ title }}</a>
<div style="margin-top:10px;font:400 14px/1.55 Inter,sans-serif;color:#5A6472">
<sc-for list="{{ authorList }}" as="a" hint-placeholder-count="3"><sc-if value="{{ a.bold }}" hint-placeholder-val="{{ false }}"><span style="font-weight:600;color:#14181D">{{ a.name }}</span></sc-if><sc-if value="{{ a.plain }}" hint-placeholder-val="{{ true }}"><span>{{ a.name }}</span></sc-if><span>{{ a.sep }}</span></sc-for>
</div>
<div style="margin-top:8px;font:400 14px/1.55 Inter,sans-serif;color:#14181D">{{ venue }}<span style="color:#5A6472">{{ volume }}</span></div>
<div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:8px">
<span style="font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5A6472;background:#FAFAF8;border:1px solid #E8ECF1;padding:5px 9px;border-radius:4px">{{ theme }}</span>
<sc-if value="{{ openAccess }}" hint-placeholder-val="{{ false }}">
<span style="font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5A6472;background:#FAFAF8;border:1px solid #E8ECF1;padding:5px 9px;border-radius:4px">OPEN ACCESS</span>
</sc-if>
</div>
</div>
<div style="text-align:right">
<div style="font:600 19px/1 'IBM Plex Mono',monospace;color:#14181D;letter-spacing:-.02em">{{ citations }}</div>
<div style="margin-top:6px;font:500 9.5px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#5A6472">CITATIONS</div>
<div style="margin-top:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-end">
<a href="{{ href }}" style="font:600 12.5px Inter,sans-serif;color:#004B8C;border:1px solid #C3D4E4;border-radius:5px;padding:7px 12px;white-space:nowrap" style-hover="background:#E6EEF5">Cite</a>
<a href="{{ href }}" style="font:500 12.5px Inter,sans-serif;color:#004B8C;white-space:nowrap">{{ doi }} →</a>
</div>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:880,&quot;height&quot;:210},&quot;year&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2026&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pubType&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Journal&quot;,&quot;Conference&quot;,&quot;Book chapter&quot;],&quot;default&quot;:&quot;Journal&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;quartile&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;Q1&quot;,&quot;Q2&quot;,&quot;Q3&quot;,&quot;Q4&quot;],&quot;default&quot;:&quot;Q1&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Federated anomaly detection for distributed pipeline monitoring under intermittent connectivity&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;authors&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[{&quot;name&quot;:&quot;Iskandar, S.&quot;,&quot;bold&quot;:true},{&quot;name&quot;:&quot;Rahim, A. N.&quot;,&quot;bold&quot;:true},{&quot;name&quot;:&quot;Verma, P.&quot;}],&quot;tsType&quot;:&quot;{name:string,bold?:boolean}[]&quot;},&quot;venue&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;IEEE Transactions on Industrial Informatics&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;volume&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;vol. 22(4)&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;citations&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;14&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;doi&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;DOI&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;T3 INTELLIGENT &amp; DISTRIBUTED SYSTEMS&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;openAccess&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const authors = this.props.authors ?? [];
    const q = this.props.quartile ?? '';
    return {
      authorList: authors.map((a, i) => ({
        name: a.name, bold: !!a.bold, plain: !a.bold,
        sep: i < authors.length - 1 ? ', ' : ''
      })),
      hasQuartile: !!q,
      openAccess: !!this.props.openAccess,
      typeLabel: (this.props.pubType ?? 'JOURNAL').toUpperCase(),
      volume: this.props.volume ? ' · ' + this.props.volume : ''
    };
  }
}

</script>
</body>
</html>
