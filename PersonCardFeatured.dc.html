<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./image-slot.js"></script></helmet>
<div style="background:#FFFFFF;border:1px solid #D8DEE5;border-radius:8px;box-shadow:0 2px 8px rgba(20,24,29,.07);height:100%;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden">
<div style="height:4px;background:#004B8C;flex:none"></div>
<div style="padding:22px 24px 22px;display:flex;flex-direction:column;flex:1">
<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
<div style="width:72px;height:72px;flex:none"><sc-if value="{{ hasPhoto }}" hint-placeholder-val="{{ false }}"><img src="{{ photo }}" alt="{{ personName }}" style="width:72px;height:72px;border-radius:50%;object-fit:cover;object-position:center 22%;display:block;background:#E6EEF5"></sc-if><sc-if value="{{ noPhoto }}" hint-placeholder-val="{{ true }}"><image-slot id="{{ slotId }}" shape="circle" placeholder="Photo" style="width:72px;height:72px;display:block"></image-slot></sc-if></div>
<sc-if value="{{ hasBadge }}" hint-placeholder-val="{{ false }}">
<span style="font:600 10.5px 'IBM Plex Mono',monospace;letter-spacing:.09em;color:#14181D;background:#E38C07;padding:6px 10px;border-radius:4px;text-align:right">{{ badge }}</span>
</sc-if>
</div>
<sc-if value="{{ hasHonorific }}" hint-placeholder-val="{{ false }}">
<div style="margin-top:16px;font:400 13px/1.3 Inter,sans-serif;color:#5A6472">{{ honorific }}</div>
</sc-if>
<div style="margin-top:{{ nameGap }};font:700 19px/1.26 'Inter Tight',sans-serif;letter-spacing:-.012em;color:#14181D;text-wrap:pretty">{{ personName }}</div>
<sc-if value="{{ hasRole }}" hint-placeholder-val="{{ true }}">
<div style="margin-top:10px;font:500 13.5px/1.4 Inter,sans-serif;color:#004B8C">{{ role }}</div>
</sc-if>
<sc-if value="{{ hasChip }}" hint-placeholder-val="{{ false }}">
<div style="margin-top:12px;display:flex"><span style="font:500 11.5px 'IBM Plex Mono',monospace;color:#00335F;background:#F3F7FA;border:1px solid #D8DEE5;border-radius:4px;padding:5px 9px">{{ chip }}</span></div>
</sc-if>
<sc-if value="{{ hasGroup }}" hint-placeholder-val="{{ false }}">
<div style="margin-top:18px;padding-top:16px;border-top:1px solid #E6EEF5;font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:#5A6472">RESEARCH GROUP</div>
<div style="margin-top:6px;font:400 14px/1.45 Inter,sans-serif;color:#14181D">{{ group }}</div>
</sc-if>
<div style="margin-top:auto;padding-top:22px;display:flex;align-items:center;justify-content:space-between;gap:12px">
<div style="display:flex;gap:8px">
<a href="{{ mailto }}" aria-label="Email" title="{{ email }}" style="width:30px;height:30px;box-sizing:border-box;border:1px solid #D8DEE5;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#5A6472" style-hover="border-color:#004B8C;color:#004B8C"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg></a>
<a href="#" aria-label="Google Scholar" style="width:30px;height:30px;box-sizing:border-box;border:1px solid #D8DEE5;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#5A6472" style-hover="border-color:#004B8C;color:#004B8C"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"></path><path d="M6 11v5c3 2 9 2 12 0v-5"></path></svg></a>
<a href="{{ profileHref }}" aria-label="Profile" style="width:30px;height:30px;box-sizing:border-box;border:1px solid #D8DEE5;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#5A6472" style-hover="border-color:#004B8C;color:#004B8C"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></a>
</div>
<a href="{{ profileHref }}" style="font:600 13px Inter,sans-serif;color:#004B8C;border-bottom:2px solid #E38C07;padding-bottom:2px" style-hover="color:#00335F">Full profile →</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:340},&quot;badge&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;DIRECTOR&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;honorific&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Prof. Ts. Dr.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;personName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Jafreezal Jaafar&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Director, CERDAS&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;department&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;chip&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Principal Researcher&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;group&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Next-Generation &amp; Quantum Computing&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;email&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;jafreez@utp.edu.my&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;slotId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const PHOTOS = {
  'hamzah-sakidin': 'assets/people/hamzah-sakidin.png',
  'izzatdin-abdul-aziz': 'assets/people/izzatdin-abdul-aziz.png',
  'jafreezal-jaafar': 'assets/people/jafreezal-jaafar.jpg',
  'maged-mohamed-saeed-nasser': 'assets/people/maged-saeed-nasser.jpg',
  'maged-mohammed-saeed-nasser': 'assets/people/maged-saeed-nasser.jpg',
  'nazleeni-samiha-haron-baharon': 'assets/people/nazleeni-samiha-haron.png',
  'noureen-talpur': 'assets/people/noureen-talpur.jpeg',
  'nur-syadhila-che-lah': 'assets/people/nur-syadhila-che-lah.jpg',
  'said-jadid-abdulkadir': 'assets/people/said-jadid-abdulkadir.png',
  'shuhaida-mohamed-shuhidan': 'assets/people/shuhaida-mohamed-shuhidan.jpg',
  'syahirah-bt-suboh': 'assets/people/syahirah-suboh.jpg',
  'yaman-hamed': 'assets/people/yaman-hamed.jpg',
  'ibrahim-venkat-krishnamurthy': 'assets/people/ibrahim-venkat-krishnamurthy.png'
};
class Component extends DCLogic {
  renderVals() {
    const v = k => this.props[k] ?? '';
    const email = v('email'), href = v('href'), name = v('personName');
    const role = v('role') || v('department');
    const honorific = v('honorific');
    const nameKey = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const photo = this.props.photo || PHOTOS[nameKey] || '';
    return {
      photo, hasPhoto: !!photo, noPhoto: !photo,
      slotId: v('slotId') || 'person-' + name.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
      badge: v('badge'), hasBadge: !!v('badge'),
      honorific, hasHonorific: !!honorific, nameGap: honorific ? '4px' : '16px',
      personName: name,
      role, hasRole: !!role,
      chip: v('chip'), hasChip: !!v('chip'),
      group: v('group'), hasGroup: !!v('group'),
      email, mailto: email ? 'mailto:' + email : '#',
      profileHref: href || '#'
    };
  }
}
</script>
</body>
</html>
