<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div>
<div style="width:34px;height:3px;background:#E38C07;margin-bottom:20px"></div>
<sc-if value="{{ real }}" hint-placeholder-val="{{ true }}"><div style="font:600 46px/1 'IBM Plex Mono',monospace;color:#004B8C;letter-spacing:-.02em;white-space:nowrap"><span data-count="{{ count }}">{{ count }}</span>{{ suffix }}</div></sc-if>
<sc-if value="{{ dummy }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:baseline;gap:8px;white-space:nowrap"><span style="font:600 46px/1 'IBM Plex Mono',monospace;letter-spacing:-.02em;color:#A0A4AB;text-decoration-line:underline;text-decoration-style:dotted;text-decoration-thickness:1px;text-underline-offset:6px"><span data-count="{{ count }}">{{ count }}</span>{{ suffix }}</span><span style="font:500 11px/1 Inter,sans-serif;color:#A0A4AB">(dummy)</span></div></sc-if>
<div style="margin-top:10px;font:500 12px Inter,sans-serif;letter-spacing:.09em;color:#5A6472">{{ label }}</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:280,&quot;height&quot;:140},&quot;count&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;68&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;suffix&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;RESEARCHERS&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props.placeholder;
    const dummy = p === true || p === 'true';
    return { count: this.props.count ?? '', suffix: this.props.suffix ?? '', label: this.props.label ?? '', dummy, real: !dummy };
  }
}

</script>
</body>
</html>
