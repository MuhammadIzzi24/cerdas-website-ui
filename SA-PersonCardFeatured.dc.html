<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:#FFFFFF;border:1px solid #D8DEE5;border-radius:8px;box-shadow:0 2px 8px rgba(20,24,29,.07);height:100%;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden">
<div style="height:4px;background:#004B8C;flex:none"></div>
<div style="padding:26px;display:flex;flex-direction:column;flex:1">
<sc-if value="{{ hasBadge }}" hint-placeholder-val="{{ true }}">
<div style="display:flex"><span style="font:600 10.5px 'IBM Plex Mono',monospace;letter-spacing:.09em;color:#14181D;background:#E38C07;padding:6px 10px;border-radius:4px;white-space:nowrap">{{ badge }}</span></div>
</sc-if>
<div style="margin-top:20px;font:700 20px/1.24 'Inter Tight',sans-serif;letter-spacing:-.012em;color:#14181D;text-wrap:pretty">{{ personName }}</div>
<sc-if value="{{ hasRole }}" hint-placeholder-val="{{ true }}">
<div style="margin-top:10px;font:500 13.5px/1.4 Inter,sans-serif;color:#004B8C">{{ role }}</div>
</sc-if>
<sc-if value="{{ hasDept }}" hint-placeholder-val="{{ true }}">
<div style="margin-top:20px;padding-top:18px;border-top:1px solid #E6EEF5;font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:#5A6472">DEPARTMENT</div>
<div style="margin-top:5px;font:400 14px/1.45 Inter,sans-serif;color:#14181D">{{ department }}</div>
</sc-if>
<sc-if value="{{ hasEmail }}" hint-placeholder-val="{{ true }}">
<div style="margin-top:14px;font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:#5A6472">EMAIL</div>
<a href="{{ mailto }}" style="margin-top:5px;font:500 14px/1.45 Inter,sans-serif;color:#004B8C;word-break:break-all" style-hover="color:#00335F">{{ email }}</a>
</sc-if>
<sc-if value="{{ hasProfile }}" hint-placeholder-val="{{ false }}">
<div style="margin-top:auto;padding-top:22px;display:flex;justify-content:flex-end">
<a href="{{ href }}" style="font:600 13px Inter,sans-serif;color:#004B8C;border-bottom:2px solid #E38C07;padding-bottom:2px">Full profile →</a>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:340},&quot;badge&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;DIRECTOR&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;personName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Jafreezal Jaafar&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Director, CERDAS&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;department&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Dean FSMC&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;email&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;jafreez@utp.edu.my&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const v = k => this.props[k] ?? '';
    const email = v('email'), href = v('href');
    return {
      badge: v('badge'), hasBadge: !!v('badge'),
      personName: v('personName'),
      role: v('role'), hasRole: !!v('role'),
      department: v('department'), hasDept: !!v('department'),
      email, hasEmail: !!email, mailto: email ? 'mailto:' + email : '#',
      href, hasProfile: !!href
    };
  }
}
</script>
</body>
</html>
